# Development override.
# Use: docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
# Source mounts are read-only so containers cannot create or rewrite host files.
services:
  migration:
    env_file:
      - ./backend/.env.docker
    volumes:
      - ./backend/app:/app/app:ro
      - ./backend/database:/app/database:ro

  api:
    env_file:
      - ./backend/.env.docker
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./backend/app:/app/app:ro
      - ./backend/database:/app/database:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - shulelink-dev

  mysql:
    image: mariadb:11.4
    env_file:
      - ./docker/mysql.env
    volumes:
      - mysql_dev_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u root -p\"$${MARIADB_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - shulelink-dev

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - shulelink-dev

volumes:
  mysql_dev_data:

networks:
  shulelink-dev:
    driver: bridge
