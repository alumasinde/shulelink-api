services:
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env.docker
    depends_on:
      mysql:
        condition: service_healthy
    command: ["python", "-m", "app.migrate"]
    restart: "no"
    networks:
      - shulelink-dev

  api:
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
      - ./backend/database:/app/database:ro
